name: CloudCraft frontend validation

on:
  pull_request:
    branches: [beta]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudcraft-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend typecheck, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format CloudCraft source for review
        run: |
          pnpm exec prettier --write apps/app-frontend/src/pages/CloudCraft.vue apps/app-frontend/src/helpers/cloudSession.ts
          echo 'BEGIN_CLOUDCRAFT_PAGE_OUTPUT'
          cat apps/app-frontend/src/pages/CloudCraft.vue
          echo 'END_CLOUDCRAFT_PAGE_OUTPUT'
          echo 'BEGIN_CLOUD_SESSION_HELPER_OUTPUT'
          cat apps/app-frontend/src/helpers/cloudSession.ts
          echo 'END_CLOUD_SESSION_HELPER_OUTPUT'
      - name: TypeScript and Vue typecheck
        run: pnpm --filter @modrinth/app-frontend run tsc:check
      - name: ESLint
        run: pnpm --filter @modrinth/app-frontend exec eslint .
      - name: Prettier for CloudCraft pages and route wiring
        run: pnpm exec prettier --check apps/app-frontend/src/pages/CloudCraft.vue apps/app-frontend/src/pages/Index.vue apps/app-frontend/src/pages/index.js apps/app-frontend/src/routes.js apps/app-frontend/index.html
      - name: Production frontend build
        run: pnpm --filter @modrinth/app-frontend run build

  rust:
    name: Rust formatting and local backup tests
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file libssl-dev libxdo-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf \
            libwebkit2gtk-4.1-dev
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check Rust formatting
        run: cargo fmt --check --package theseus_gui
      - name: Run desktop crate tests
        run: cargo test --package theseus_gui --no-default-features
