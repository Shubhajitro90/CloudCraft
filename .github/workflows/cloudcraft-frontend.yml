name: CloudCraft validation

on:
  pull_request:
    branches: [beta, cloudcraft-implementation, cloudcraft-development-completion, 'v0/**']
    paths:
      - .github/workflows/cloudcraft-frontend.yml
      - .github/scripts/**
      - apps/app-frontend/**
      - apps/app/**
      - Cargo.toml
      - Cargo.lock
      - packages/app-lib/**
      - packages/app-macros/**
      - packages/assets/**
      - packages/ui/**
      - packages/utils/**
  push:
    branches: [cloudcraft-implementation, cloudcraft-development-completion, 'v0/**']
    paths:
      - .github/workflows/cloudcraft-frontend.yml
      - .github/scripts/**
      - apps/app-frontend/**
      - apps/app/**
      - Cargo.toml
      - Cargo.lock
      - packages/app-lib/**
      - packages/app-macros/**
      - packages/assets/**
      - packages/ui/**
      - packages/utils/**
  workflow_dispatch:

permissions:
  # Validation must never write generated files or credentials back to the repository.
  contents: read

concurrency:
  group: cloudcraft-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend typecheck, lint, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting of changed frontend files
        run: |
          pnpm exec prettier --check \
            apps/app-frontend/index.html \
            apps/app-frontend/src/App.vue \
            apps/app-frontend/src/components/ui/AccountsCard.vue \
            apps/app-frontend/src/components/ui/RunningAppBar.vue \
            apps/app-frontend/src/components/ui/modal/AppSettingsModal.vue \
            apps/app-frontend/src/components/ui/modal/ConfirmModalWrapper.vue \
            apps/app-frontend/src/components/cloudcraft/ServerBackupsPanel.vue \
            apps/app-frontend/src/components/cloudcraft/ServerDeleteConfirm.vue \
            apps/app-frontend/src/components/cloudcraft/ServerDeletePanel.vue \
            apps/app-frontend/src/components/cloudcraft/ServerOperationProgress.vue \
            apps/app-frontend/src/components/cloudcraft/ServerSoftwarePanel.vue \
            apps/app-frontend/src/components/cloudcraft/ServerWorldsPanel.vue \
            apps/app-frontend/src/components/cloudcraft/LauncherAccountPanel.vue \
            apps/app-frontend/src/components/cloudcraft/CreateInstanceForm.vue \
            apps/app-frontend/src/helpers/cloudcraftInstances.ts \
            apps/app-frontend/src/helpers/cloudcraftInstances.test.mjs \
            apps/app-frontend/src/helpers/cloudcraftLauncher.ts \
            apps/app-frontend/src/helpers/cloudcraftLauncher.test.mjs \
            apps/app-frontend/src/helpers/cloudcraftOperations.ts \
            apps/app-frontend/src/helpers/cloudcraftOperations.test.mjs \
            apps/app-frontend/src/helpers/useServerOperation.ts \
            apps/app-frontend/src/helpers/cloudcraftServer.ts \
            apps/app-frontend/src/helpers/cloudSession.ts \
            apps/app-frontend/src/helpers/cloudcraftDiagnostics.ts \
            apps/app-frontend/src/helpers/cloudcraftDiagnostics.test.mjs \
            apps/app-frontend/src/components/cloudcraft/CloudGamingPanel.vue \
            apps/app-frontend/src/components/cloudcraft/InstanceExitReport.vue \
            apps/app-frontend/src/components/cloudcraft/InstanceSettingsEditor.vue \
            apps/app-frontend/src/helpers/cloudStorage.ts \
            apps/app-frontend/src/helpers/update.js \
            apps/app-frontend/src/pages/CloudCraft.vue \
            apps/app-frontend/src/pages/Index.vue \
            apps/app-frontend/src/pages/index.js \
            apps/app-frontend/src/routes.js

      - name: Lint changed frontend files
        run: |
          pnpm --filter @modrinth/app-frontend exec eslint \
            src/App.vue \
            src/components/ui/AccountsCard.vue \
            src/components/ui/RunningAppBar.vue \
            src/components/ui/modal/AppSettingsModal.vue \
            src/components/ui/modal/ConfirmModalWrapper.vue \
            src/components/cloudcraft/ServerBackupsPanel.vue \
            src/components/cloudcraft/ServerDeleteConfirm.vue \
            src/components/cloudcraft/ServerDeletePanel.vue \
            src/components/cloudcraft/ServerOperationProgress.vue \
            src/components/cloudcraft/ServerSoftwarePanel.vue \
            src/components/cloudcraft/ServerWorldsPanel.vue \
            src/components/cloudcraft/LauncherAccountPanel.vue \
            src/components/cloudcraft/CreateInstanceForm.vue \
            src/helpers/cloudcraftInstances.ts \
            src/helpers/cloudcraftLauncher.ts \
            src/helpers/cloudcraftOperations.ts \
            src/helpers/useServerOperation.ts \
            src/helpers/cloudcraftServer.ts \
            src/helpers/cloudSession.ts \
            src/helpers/cloudcraftDiagnostics.ts \
            src/components/cloudcraft/CloudGamingPanel.vue \
            src/components/cloudcraft/InstanceExitReport.vue \
            src/components/cloudcraft/InstanceSettingsEditor.vue \
            src/helpers/cloudStorage.ts \
            src/helpers/update.js \
            src/pages/CloudCraft.vue \
            src/pages/Index.vue \
            src/pages/index.js \
            src/routes.js

      - name: TypeScript and Vue typecheck
        run: pnpm --filter @modrinth/app-frontend run tsc:check

      - name: Production frontend build
        run: pnpm --filter @modrinth/app-frontend run build

      - name: Use Node 22 for TypeScript test runner
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Frontend operation logic tests
        run: |
          node --experimental-strip-types --test \
            apps/app-frontend/src/helpers/cloudcraftOperations.test.mjs \
            apps/app-frontend/src/helpers/cloudcraftLauncher.test.mjs \
            apps/app-frontend/src/helpers/cloudcraftInstances.test.mjs \
            apps/app-frontend/src/helpers/cloudcraftDiagnostics.test.mjs \
            .github/scripts/validate-installers.test.mjs

  rust:
    name: Rust formatting and local-backup safety tests
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file libssl-dev libxdo-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf \
            libwebkit2gtk-4.1-dev pkg-config

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --check --package theseus_gui

      - name: Run desktop crate tests
        run: cargo test --package theseus_gui --no-default-features

      - name: Run verified installer downloader tests
        run: cargo test --package theseus --lib api::download

  server-e2e:
    name: Real server end-to-end (network, Java 21)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev pkg-config

      - name: Set up Java 21
        id: java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # Downloads Paper from the official PaperMC API, verifies its SHA-256, starts the
      # real server, pings it, restarts, stops, and checks world persistence and
      # export/import. These tests are #[ignore]d in the unit job because they need
      # network access and a Java runtime. The real Sunshine/Moonlight test is
      # excluded: it needs a personal streaming host and is run only by hand.
      - name: Run ignored real-network tests
        env:
          CLOUDCRAFT_REAL_JAVA: ${{ steps.java.outputs.path }}/bin/java
        run: cargo test --package theseus_gui --no-default-features -- --ignored --nocapture --skip real_sunshine

  streaming-e2e:
    name: Real Sunshine to Moonlight stream (loopback, no secrets)
    # Ubuntu 24.04 matches the Sunshine package below (glibc 2.39).
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SUNSHINE_VERSION: v2026.914.233613
      SUNSHINE_DEB: sunshine_2026.914.233613-1+ubuntu24.04_amd64.deb
      SUNSHINE_SHA256: c38e9c705f650f8705f61702717e99bec34044c5028fcb8f23a08fe041292c21
      MOONLIGHT_VERSION: v6.2.0
      MOONLIGHT_APPIMAGE: Moonlight-6.2.0-x86_64.AppImage
      MOONLIGHT_SHA256: 787b0dcbd42ae90620e76fb8d77d7c441ba6473a91c2d7fc3a0fc2466f992437
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build, display and audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libssl-dev libxdo-dev libayatana-appindicator3-dev \
            librsvg2-dev libwebkit2gtk-4.1-dev pkg-config \
            xvfb xauth x11-apps mesa-utils libegl1 libgl1-mesa-dri \
            pulseaudio pulseaudio-utils dbus-x11 openssl curl

      - name: Download and verify Sunshine and Moonlight (pinned SHA-256)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stream" && cd "$RUNNER_TEMP/stream"
          curl -fsSL -o "$SUNSHINE_DEB" "https://github.com/LizardByte/Sunshine/releases/download/$SUNSHINE_VERSION/$SUNSHINE_DEB"
          curl -fsSL -o "$MOONLIGHT_APPIMAGE" "https://github.com/moonlight-stream/moonlight-qt/releases/download/$MOONLIGHT_VERSION/$MOONLIGHT_APPIMAGE"
          printf '%s  %s\n%s  %s\n' "$SUNSHINE_SHA256" "$SUNSHINE_DEB" "$MOONLIGHT_SHA256" "$MOONLIGHT_APPIMAGE" | sha256sum --check --strict
          sudo apt-get install -y "./$SUNSHINE_DEB"
          chmod +x "$MOONLIGHT_APPIMAGE"
          # No FUSE on runners: extract and run the real ELF binary, not the AppRun wrapper.
          "./$MOONLIGHT_APPIMAGE" --appimage-extract >/dev/null
          test -x squashfs-root/usr/bin/moonlight
          echo "CLOUDCRAFT_MOONLIGHT=$RUNNER_TEMP/stream/squashfs-root/usr/bin/moonlight" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build the desktop test binary
        run: cargo test --package theseus_gui --no-default-features --no-run

      - name: Stream end to end
        env:
          CC_EVIDENCE_DIR: ${{ runner.temp }}/sunshine-e2e
          CC_HOLD_SECS: '15'
        run: bash .github/scripts/sunshine-loopback-e2e.sh

      - name: Upload stream evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sunshine-e2e-evidence
          path: ${{ runner.temp }}/sunshine-e2e
          if-no-files-found: warn
