name: 'CloudCraft desktop build'
on:
  push:
    branches:
      - feature*
      - cloudcraft-implementation
      - 'v0/**'
    tags:
      - 'build*'
      - 'v*'
    paths:
      - .github/workflows/theseus-release.yml
      - 'apps/app/**'
      - 'apps/app-frontend/**'
      - 'packages/app-lib/**'
      - 'packages/app-macros/**'
      - 'packages/assets/**'
      - 'packages/ui/**'
      - 'packages/utils/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudcraft-desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.platform }}
    env:
      HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Rust setup (mac)
        if: startsWith(matrix.platform, 'macos')
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Rust setup
        if: "!startsWith(matrix.platform, 'macos')"
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup rust cache
        uses: actions/cache@v4
        with:
          path: |
            target/**
            !target/*/release/bundle/*/*.dmg
            !target/*/release/bundle/*/*.app.tar.gz
            !target/*/release/bundle/*/*.app.tar.gz.sig
            !target/release/bundle/*/*.dmg
            !target/release/bundle/*/*.app.tar.gz
            !target/release/bundle/*/*.app.tar.gz.sig

            !target/release/bundle/appimage/*.AppImage
            !target/release/bundle/appimage/*.AppImage.tar.gz
            !target/release/bundle/appimage/*.AppImage.tar.gz.sig
            !target/release/bundle/deb/*.deb
            !target/release/bundle/rpm/*.rpm

            !target/release/bundle/msi/*.msi
            !target/release/bundle/msi/*.msi.zip
            !target/release/bundle/msi/*.msi.zip.sig

            !target/release/bundle/nsis/*.exe
            !target/release/bundle/nsis/*.nsis.zip
            !target/release/bundle/nsis/*.nsis.zip.sig
          key: ${{ runner.os }}-rust-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-target-

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm via corepack
        shell: bash
        run: |
          corepack enable
          corepack prepare --activate

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: install dependencies (ubuntu only)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev pkg-config libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Platform signing is optional and driven only by repository secrets. When a
      # secret is absent the build is produced unsigned and reported as unsigned.
      # See docs/RELEASING.md for the secret names and how to create them.
      - name: Configure macOS signing (only when secrets exist)
        if: startsWith(matrix.platform, 'macos') && env.HAS_APPLE_CERTIFICATE == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then echo "::error::$name is required when APPLE_CERTIFICATE is set"; exit 1; fi
            # Values go to GITHUB_ENV through a heredoc so they are never echoed.
            { echo "$name<<__CC_EOF__"; echo "${!name}"; echo "__CC_EOF__"; } >> "$GITHUB_ENV"
          done

      - name: Configure Windows signing (only when secrets exist)
        if: startsWith(matrix.platform, 'windows') && env.HAS_WINDOWS_CERTIFICATE == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'cloudcraft-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          "CLOUDCRAFT_WINDOWS_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Write CI Tauri config
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const config = JSON.parse(fs.readFileSync("apps/app/tauri-release.conf.json", "utf8"));
            const thumbprint = process.env.CLOUDCRAFT_WINDOWS_THUMBPRINT;
            if (thumbprint) config.bundle = { windows: { certificateThumbprint: thumbprint } };
            fs.writeFileSync("apps/app/tauri-ci.conf.json", JSON.stringify(config, null, 2));
          '

      - name: build app (macos)
        run: pnpm --filter=@modrinth/app run tauri build --target universal-apple-darwin --config "tauri-ci.conf.json"
        if: startsWith(matrix.platform, 'macos')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: build app
        run: pnpm --filter=@modrinth/app run tauri build --config "tauri-ci.conf.json"
        id: build_os
        if: "!startsWith(matrix.platform, 'macos')"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate installers and write checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cloudcraft-dist
          find target -path '*/release/bundle/*' -type f \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) \
            -print | while read -r f; do
            [ -s "$f" ] || { echo "::error::empty installer $f"; exit 1; }
            cp "$f" cloudcraft-dist/
          done
          count=$(ls cloudcraft-dist | wc -l)
          [ "$count" -gt 0 ] || { echo "::error::no installers were produced"; exit 1; }
          cd cloudcraft-dist
          if command -v sha256sum >/dev/null; then sha256sum -- * > "SHA256SUMS-${{ matrix.platform }}.txt"; else shasum -a 256 -- * > "SHA256SUMS-${{ matrix.platform }}.txt"; fi
          {
            echo "### Installers (${{ matrix.platform }})"
            echo '```'
            cat "SHA256SUMS-${{ matrix.platform }}.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report signature status
        shell: bash
        run: |
          cd cloudcraft-dist
          case "${{ matrix.platform }}" in
            macos*)
              for f in *.dmg; do
                if codesign --verify --verbose=2 "$f" 2>/dev/null; then echo "$f: signed" >> "$GITHUB_STEP_SUMMARY"; else echo "$f: UNSIGNED" >> "$GITHUB_STEP_SUMMARY"; fi
              done ;;
            windows*)
              pwsh -NoProfile -Command 'Get-ChildItem *.exe,*.msi | ForEach-Object { "$($_.Name): $((Get-AuthenticodeSignature $_.FullName).Status)" }' >> "$GITHUB_STEP_SUMMARY" ;;
            *)
              echo "Linux packages are not code-signed; verify them with SHA256SUMS.txt." >> "$GITHUB_STEP_SUMMARY" ;;
          esac

      - name: Upload checksummed installers
        uses: actions/upload-artifact@v4
        with:
          name: CloudCraft-dist-${{ matrix.platform }}
          if-no-files-found: error
          path: cloudcraft-dist/*

      - name: Upload CloudCraft installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CloudCraft-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            target/*/release/bundle/*/*.dmg
            target/*/release/bundle/*/*.app.tar.gz
            target/*/release/bundle/*/*.app.tar.gz.sig
            target/release/bundle/*/*.dmg
            target/release/bundle/*/*.app.tar.gz
            target/release/bundle/*/*.app.tar.gz.sig

            target/release/bundle/*/*.AppImage
            target/release/bundle/*/*.AppImage.tar.gz
            target/release/bundle/*/*.AppImage.tar.gz.sig
            target/release/bundle/*/*.deb
            target/release/bundle/*/*.rpm

            target/release/bundle/msi/*.msi
            target/release/bundle/msi/*.msi.zip
            target/release/bundle/msi/*.msi.zip.sig

            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.nsis.zip
            target/release/bundle/nsis/*.nsis.zip.sig
