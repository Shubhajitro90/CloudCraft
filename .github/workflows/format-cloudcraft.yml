name: One-time CloudCraft formatting repair

on:
  push:
    branches: [cloudcraft-implementation]
    paths:
      - .github/workflows/format-cloudcraft.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudcraft-implementation
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/app-frontend/src/pages/CloudCraft.vue
      - name: Commit formatting correction
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/app-frontend/src/pages/CloudCraft.vue
          git commit -m "Fix CloudCraft page formatting"
          git push origin HEAD:cloudcraft-implementation
